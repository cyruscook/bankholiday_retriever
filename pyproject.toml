[project]
name = "bankholiday-retriever"
version = "0.1.0"
description = "Retrieves proclamations of bank holidays under Section 1 of the Banking and Financial Dealings Act 1971 and updates an S3 bucket with the parsed results"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "boto3>=1.42.44",
    "lxml>=6.0.2",
    "urllib3>=2.6.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
